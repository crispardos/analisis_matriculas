[project]
name = "analisis-matriculas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CrisPSdev", email = "crispsdev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
]

[project.scripts]
analisis-matriculas = "analisis_matriculas:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
